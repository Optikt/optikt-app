 else if(a=='stat')pop(b,NEXT[sale.status].map(s=>`<button data-a="st" data-s="${s}"><span><span class="pill p-${s}">${ST[s]}</span><small>${TD[s]}</small></span></button>`).join(''))

const tip=$('#tip');let tT,tC=null;
function hideTip(){clearTimeout(tT);tip.classList.remove('on');tC=null}
function showTip(el){const sr=$('#stage').getBoundingClientRect(),k=sr.width/S.W,r=el.getBoundingClientRect();tip.textContent=el.dataset.tip;tip.classList.add('on');const tw=tip.offsetWidth,th=tip.offsetHeight;let x=(r.left+r.width/2-sr.left)/k-tw/2,y=(r.top-sr.top)/k-th-8;if(y<8)y=(r.bottom-sr.top)/k+8;tip.style.left=Math.max(8,Math.min(S.W-tw-8,x))+'px';tip.style.top=y+'px'}
