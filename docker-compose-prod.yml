services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: optikt
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: optikt_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U optikt -d optikt_db']
      interval: 10s
      timeout: 5s
      retries: 5

  optikt-app:
    image: optikt/optikt-app:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ORIGIN: ${ORIGIN}
      DATABASE_URL: postgresql://optikt:${DB_PASSWORD}@postgres:5432/optikt_db
      SENTRY_DSN: ${SENTRY_DSN:-}
      PUBLIC_SENTRY_DSN: ${PUBLIC_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      PUBLIC_SENTRY_ENVIRONMENT: ${PUBLIC_SENTRY_ENVIRONMENT:-production}
      EXCHANGE_RATES_API_URL: ${EXCHANGE_RATES_API_URL:-}
      EXCHANGE_RATES_API_KEY: ${EXCHANGE_RATES_API_KEY:-}
      EXCHANGE_RATES_POLL_INTERVAL_MS: ${EXCHANGE_RATES_POLL_INTERVAL_MS:-300000}
      EXCHANGE_RATES_STALE_THRESHOLD_MS: ${EXCHANGE_RATES_STALE_THRESHOLD_MS:-1800000}
    ports:
      - '3000:3000'

  backup:
    image: optikt/optikt-backup:latest
    container_name: optikt-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: optikt
      PG_PASSWORD: ${DB_PASSWORD}
      PG_DB: optikt_db
      GOOGLE_DRIVE_BACKUP_FOLDER_ID: ${GOOGLE_DRIVE_BACKUP_FOLDER_ID}
      RCLONE_CONFIG_GDRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_BACKUP_FOLDER_ID}
      DRIVE_REMOTE: gdrive
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      TZ: ${TZ:-UTC}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${RCLONE_CONFIG_GDRIVE_TOKEN}
      NOTIFY_URL: ${BACKUP_NOTIFY_URL:-}
      NOTIFY_TOKEN: ${BACKUP_NOTIFY_TOKEN:-}

volumes:
  postgres_data:
