name: Docker Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  docker:
    name: Bump Version And Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Ensure release runs from default branch
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "This workflow must run from $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Bump package version
        run: npm version "${{ inputs.bump }}" --no-git-tag-version

      - name: Read package version
        id: version
        run: |
          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version bump and tag release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/optikt-app:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/optikt-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push release commit and tag
        run: git push origin "HEAD:${GITHUB_REF_NAME}" --follow-tags

      # STEPS FOR DOKPLOY VÍA TAILSCALE

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Trigger Dokploy Deployment
        run: |
          echo "Triggering deployment in Dokploy..."
          curl -X GET "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
