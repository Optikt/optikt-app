name: Docker Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to publish
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  docker:
    name: Preflight Checks And Publish Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

    steps:
      - name: Ensure release runs from default branch
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "This workflow must run from $DEFAULT_BRANCH."
            exit 1
          fi

      # ==================== PREFLIGHT: validar accesos antes de publicar ====================

      - name: Checkout code (validates RELEASE_PUSH_TOKEN)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Validate GitHub release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is not set. Add it to the repository secrets (Contents read/write)."
            exit 1
          fi

          status="$(curl -sS -o /tmp/repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}")"

          if [ "$status" != "200" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is invalid, expired or lacks access (HTTP $status on ${{ github.repository }}). Renew the token and retry."
            cat /tmp/repo.json
            exit 1
          fi

          can_push="$(node -e 'const r=require("/tmp/repo.json"); console.log(r.permissions && r.permissions.push ? "yes" : "no")')"
          if [ "$can_push" != "yes" ]; then
            echo "::error::RELEASE_PUSH_TOKEN does not grant push (Contents read/write) on ${{ github.repository }}."
            exit 1
          fi
          echo "RELEASE_PUSH_TOKEN is valid and can push to ${{ github.repository }}."

      - name: Compute version and check tag availability
        id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version >/dev/null

          VERSION="$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists on origin. If the previous release already published its commit and tag, launch a NEW workflow_dispatch from $GITHUB_REF_NAME (a Re-run reuses the same github.sha, recomputes the same version and would collide again). Only if the tag is orphaned (its commit is not on $GITHUB_REF_NAME): git push origin --delete v$VERSION"
            exit 1
          fi
          echo "Tag v$VERSION is available on origin."

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Check Dokploy reachability via Tailscale
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is not set. Add the Dokploy deployment webhook URL to the repository secrets."
            exit 1
          fi

          host="$(node -e 'console.log(new URL(process.env.DOKPLOY_WEBHOOK_URL).hostname)')"
          port="$(node -e 'const u=new URL(process.env.DOKPLOY_WEBHOOK_URL); console.log(u.port || (u.protocol === "https:" ? "443" : "80"))')"

          if tailscale ping --c 3 --timeout 5s "$host" >/tmp/tsping.txt 2>&1; then
            echo "tailscale ping to '$host' OK."
            cat /tmp/tsping.txt
            exit 0
          fi

          echo "tailscale ping failed; trying a plain TCP connect to $host:$port..."
          if timeout 10 bash -c "exec 3<>/dev/tcp/$host/$port" 2>/dev/null; then
            echo "TCP connect to $host:$port OK."
            exit 0
          fi

          echo "::error::Dokploy host '$host' is unreachable (tailscale ping and TCP connect both failed). Check the tailnet/Dokploy node before retrying."
          cat /tmp/tsping.txt
          exit 1

      - name: Login to Docker Hub (validates DOCKER credentials)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # ==================== PUBLICACIÓN: solo si todo el preflight pasó ====================

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost:5432/build
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/optikt-app:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/optikt-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The preflight token check ran before the build; a PAT can expire meanwhile.
      - name: Re-validate GitHub release token before tagging
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_PUSH_TOKEN is not set. No tag or commit was created."
            exit 1
          fi

          status="$(curl -sS -o /tmp/repo-recheck.json -w '%{http_code}' \
            -H "Authorization: Bearer $RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}")"

          if [ "$status" != "200" ]; then
            echo "::error::RELEASE_PUSH_TOKEN expired or lost access during the build (HTTP $status on ${{ github.repository }}). No tag or commit was created; renew the token and launch a new dispatch."
            cat /tmp/repo-recheck.json
            exit 1
          fi

          can_push="$(node -e 'const r=require("/tmp/repo-recheck.json"); console.log(r.permissions && r.permissions.push ? "yes" : "no")')"
          if [ "$can_push" != "yes" ]; then
            echo "::error::RELEASE_PUSH_TOKEN no longer grants push (Contents read/write) on ${{ github.repository }}. No tag or commit was created; fix the token and launch a new dispatch."
            exit 1
          fi
          echo "RELEASE_PUSH_TOKEN is still valid."

      - name: Commit version bump, tag release and push atomically
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Fail fast if the branch moved while the image was being built.
          git fetch origin "$GITHUB_REF_NAME"
          LOCAL_HEAD="$(git rev-parse HEAD)"
          REMOTE_HEAD="$(git rev-parse FETCH_HEAD)"
          if [ "$LOCAL_HEAD" != "$REMOTE_HEAD" ]; then
            echo "::error::Branch '$GITHUB_REF_NAME' advanced during the run (local HEAD $LOCAL_HEAD, origin HEAD $REMOTE_HEAD). No commit or tag was created. Launch a new workflow_dispatch from the updated branch: the next run recomputes the same version and overwrites the image."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists on origin. If the previous release already published its commit and tag, launch a NEW workflow_dispatch from $GITHUB_REF_NAME (a Re-run reuses the same github.sha, recomputes the same version and would collide again). Only if the tag is orphaned (its commit is not on $GITHUB_REF_NAME): git push origin --delete v$VERSION"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$VERSION"
          git tag -a "v$VERSION" -m "Release v$VERSION"

          # --atomic guarantees branch and tag fail/pass together: if it fails there is
          # no orphan tag, and the next dispatch with the same version is safe.
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v$VERSION"

      # STEPS FOR DOKPLOY VÍA TAILSCALE

      - name: Trigger Dokploy Deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          echo "Triggering deployment in Dokploy..."
          status="$(curl -sS -o /tmp/dokploy-response.txt -w '%{http_code}' --max-time 60 "$DOKPLOY_WEBHOOK_URL")"
          echo "Dokploy response (HTTP $status):"
          cat /tmp/dokploy-response.txt

          case "$status" in
            2*) echo "Dokploy accepted the deployment trigger." ;;
            *) echo "::error::Dokploy trigger failed with HTTP $status. The image and release tag are already published; re-trigger the deployment from Dokploy itself (a new workflow_dispatch would publish another version)." ; exit 1 ;;
          esac
