# SonarQube Cloud — optikt-app
sonar.organization=optikt
sonar.projectKey=Optikt_optikt-app
sonar.projectName=optikt-app

sonar.projectVersion=0.29.1
sonar.sourceEncoding=UTF-8

# Sources & tests (SvelteKit + Svelte 5, TS)
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Coverage (vitest v8 lcov reporter -> ./coverage/lcov.info)
sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Generated / build output — never analyze
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.svelte-kit/**,**/coverage/**

# Exclude from coverage: tests, e2e, migrations, generated types, test infra
# (src/lib/testing es harness de integracion, no codigo de producto)
sonar.coverage.exclusions=**/*.test.ts,**/*.spec.ts,**/*.int.spec.ts,e2e/**,drizzle/**,**/routes/**,**/*.svelte,src/lib/testing/**

# Tests repiten patrones arrange/act por diseño — fuera de copy-paste detection
sonar.cpd.exclusions=**/*.test.ts,**/*.spec.ts,**/*.int.spec.ts,src/lib/testing/**
